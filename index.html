<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fútbol Libre</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #333333;
    }
    .header {
      text-align: center;
      padding: 20px 10px 10px;
    }
    .header h1 {
      color: #0d7338;
      font-size: 2.2rem;
      margin: 0 0 15px;
    }
    .header p {
      max-width: 900px;
      margin: 0 auto 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #444;
    }
    .header p strong {
      color: #0d7338;
    }
    .agenda-container {
      max-width: 950px;
      margin: 20px auto;
      padding: 0 10px;
    }
    .agenda-header {
      background-color: #12823e;
      color: white;
      text-align: center;
      padding: 8px 15px;
      font-weight: bold;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      font-size: 1rem;
    }
    .match-row {
      display: flex;
      align-items: center;
      padding: 10px 15px;
      border-bottom: 1px solid #e0e0e0;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .match-row:hover {
      background-color: #f5f5f5;
    }
    .match-time {
      font-weight: bold;
      width: 60px;
      flex-shrink: 0;
      font-size: 0.9rem;
    }
    .match-icon {
      width: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 10px;
      flex-shrink: 0;
    }
    .match-icon img {
      width: 20px;
      height: 15px;
      object-fit: cover;
    }
    .match-title {
      font-size: 0.95rem;
    }
    .match-title .tournament {
      font-weight: bold;
    }
    /* Estilos del reproductor */
    .player-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .player-content {
      background: #111;
      width: 90%;
      max-width: 800px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .player-header {
      background: #12823e;
      color: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .iframe-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
    }
    .iframe-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Fútbol Libre</h1>
    <p><strong>Fútbol Libre</strong> organiza
