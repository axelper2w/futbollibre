<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fútbol Libre</title>
  <!-- Librería Hls.js para procesar los flujos de video directos -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #ffffff; color: #333333; }
    .header { text-align: center; padding: 25px 10px 15px; }
    .header h1 { color: #0d7338; font-size: 2.5rem; margin: 0 0 15px; }
    .header p { max-width: 950px; margin: 0 auto 10px; font-size: 0.92rem; line-height: 1.4; color: #333; }
    .header p strong { color: #0d7338; }
    .agenda-container { max-width: 950px; margin: 20px auto; padding: 0 10px; }
    .agenda-header { background-color: #12823e; color: white; text-align: center; padding: 10px 15px; font-weight: bold; border-top-left-radius: 6px; border-top-right-radius: 6px; font-size: 1rem; }
    .match-row { display: flex; align-items: center; padding: 11px 15px; border-bottom: 1px solid #e0e0e0; background-color: #ffffff; cursor: pointer; transition: background-color 0.1s ease; }
    .match-row:hover { background-color: #f2f2f2; }
    .match-time { font-weight: bold; width: 65px; flex-shrink: 0; font-size: 0.95rem; color: #222; }
    .match-icon { width: 35px; display: flex; justify-content: center; align-items: center; margin-right: 12px; flex-shrink: 0; }
    .match-icon img { width: 22px; height: 18px; object-fit: contain; border-radius: 2px; }
    .match-title { font-size: 0.95rem; color: #222; }
    .match-title .tournament { font-weight: bold; }
    .player-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
    .player-content { background: #111; width: 90%; max-width: 800px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .player-header { background: #12823e; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
    .media-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
    .media-container iframe, .media-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Fútbol Libre</h1>
    <p><strong>Fútbol Libre</strong> organiza la agenda futbolística diaria con horarios, torneos y señales deportivas.</p>
  </div>

  <div class="agenda-container">
    <div class="agenda-header" id="agenda-date">Agenda de Partidos</div>
    <div id="matches-list"></div>
  </div>

  <div class="player-modal" id="playerModal">
    <div class="player-content">
      <div class="player-header">
        <span id="playerTitle">Transmisión en vivo</span>
        <button class="close-btn" onclick="closePlayer()">&times;</button>
      </div>
      <div class="media-container" id="mediaBox">
        <!-- Se adapta automáticamente entre iframe o reproductor de video HLS -->
      </div>
    </div>
  </div>

  <script>
    const partidos = [
      { hora: "18:30", pais: "EC", torneo: "Serie A", partido: "Macará vs Barcelona", streamUrl: "" },
      { hora: "19:00", pais: "UY", torneo: "Segunda División", partido: "Rentistas vs La Luz", streamUrl: "" },
      { hora: "19:15", pais: "AR", torneo: "Liga Profesional", partido: "Vélez Sarsfield vs San Lorenzo", streamUrl: "http://45.184.109.10/live/69393EAE6ADBC65A68F942022362A202/86.m3u8" },
      { hora: "20:00", pais: "CO", torneo: "Primera A", partido: "Llaneros vs Junior", streamUrl: "http://45.184.109.11/auth/FtuiWwnbNhiXJZ69UNdAr_gbnd54pu_iNFzUUR49oNKt9Ur9xoXAvkk1iuvwkR-kWCQ0xIRWeF5atblIoUo5LIOvIOYLKNFzd6z2AWa5qA_4RypQYjEZ3i8toFi2Pi9VtUcgMWzbIsZw3CMqAB4gFx9iT_rxDqoLsNSxUtdNgGVXRsLqDMr9fLWBVhZF60S7C0KF8G1UsvzKVk7LejzABPWaz8PCLzVcy3j_xG8rKDzHf6lQJwisqUwfNnJwye1Sg_S8VS-R26OOESD4Q2veGd-ncV9OWsNofA08nvAKAg5fnROTnToogeTMG912I0GWyO0Pg71JbNsToasSb1nTshabNcvOUj_zUGhKMDemgMkkVzqtwsxmO1i-pjyt_T_yPsg3OXzamQVwFUEP5GnxN7ETgql-7MGFN2SM0hZ10GWY_NiY4E8pY1qhKE8ioMYKpOpMtg6hpuz77FYvfwe4Zo0mHM3KIOfzNEyauPJfntrOgSO1UvsLhpcN_hkQQHtUApxt8-yLgIvgdE7nypqJj0J_hoTVKvULqoNaCEJVol1Gpn54R3Mhd9jiJ5f3ldDIc19jp1l7zpv-TmullYRpPl14_7iTwDUnXYIcS9I5bD_bi5Xs8PvDL83m1z32D9iq" },
      { hora: "20:00", pais: "MX", torneo: "Liga MX", partido: "Pachuca vs Tigres UANL", streamUrl: "" },
      { hora: "21:30", pais: "AR", torneo: "Liga Profesional", partido: "Estudiantes vs Instituto", streamUrl: "" },
      { hora: "22:05", pais: "MX", torneo: "Liga MX", partido: "Monterrey vs Tijuana", streamUrl: "" },
      { hora: "22:05", pais: "MX", torneo: "Liga MX", partido: "Guadalajara vs Atlante", streamUrl: "" },
      { hora: "00:10", pais: "MX", torneo: "Liga MX", partido: "América vs Toluca", streamUrl: "" },
      { hora: "00:10", pais: "MX", torneo: "Liga MX Femenil", partido: "Necaxa vs Santos Laguna", streamUrl: "" }
    ];

    let hlsInstance = null;

    function renderAgenda(data) {
      const container = document.getElementById('matches-list');
      
      if(data.length === 0) {
        container.innerHTML = '<div style="padding: 25px; text-align: center; color: #666;">No hay partidos cargados.</div>';
        return;
      }

      container.innerHTML = data.map(m => {
        let countryCode = m.pais.toLowerCase().trim();
        const iconHtml = `<img src="https://flagcdn.com/24x18/${countryCode}.png" alt="${countryCode}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53283.png'">`;

        return `
          <div class="match-row" onclick="playMatch('${m.partido.replace(/'/g, "\\'")}', '${m.streamUrl}')">
            <div class="match-time">${m.hora}</div>
            <div class="match-icon">${iconHtml}</div>
            <div class="match-title">
              <span class="tournament">${m.torneo}:</span> ${m.partido}
            </div>
          </div>
        `;
      }).join('');
    }

    function playMatch(title, url) {
      if (!url) {
        alert("Este partido aún no tiene enlace de transmisión asignado.");
        return;
      }
      
      document.getElementById('playerTitle').textContent = title;
      const mediaBox = document.getElementById('mediaBox');
      mediaBox.innerHTML = '';

      // Si es un embed de YouTube o iframe clásico
      if (url.includes('embed') || url.includes('youtube.com') || (url.startsWith('http') && !url.includes('.m3u8') && !url.includes('.ts'))) {
        let finalUrl = url;
        if (finalUrl.includes('youtube.com/watch?v=')) {
          finalUrl = finalUrl.replace('watch?v=', 'embed/');
        } else if (finalUrl.includes('youtu.be/')) {
          finalUrl = finalUrl.replace('youtu.be/', 'youtube.com/embed/');
        }
        mediaBox.innerHTML = `<iframe src="${finalUrl}" allowfullscreen></iframe>`;
      } 
      // Si es un enlace directo de transmisión (.m3u8 / IP stream)
      else {
        mediaBox.innerHTML = `<video id="videoPlayer" controls autoplay style="width:100%; height:100%;"></video>`;
        const video = document.getElementById('videoPlayer');

        if (Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls();
          hlsInstance.loadSource(url);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
            video.play();
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
          video.play();
        } else {
          video.src = url;
        }
      }

      document.getElementById('playerModal').style.display = 'flex';
    }

    function closePlayer() {
      const mediaBox = document.getElementById('mediaBox');
      mediaBox.innerHTML = '';
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      document.getElementById('playerModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => renderAgenda(partidos));
  </script>
</body>
</html>
